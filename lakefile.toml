name = "StrataPython"
version = "0.1.0"
defaultTargets = ["StrataMantle", "StrataPython", "Pylate", "pylate", "pylateTests", "pyInterpret", "pymantle"]
testDriver = "StrataPythonFrontEndTestMain"

[leanOptions]
warningAsError = true

[[require]]
name = "Strata"
git = "https://github.com/strata-org/Strata.git"
rev = "main"

[[input_file]]
name = "PythonDialectIon"
path = "Python/strata-python/dialects/Python.dialect.st.ion"

[[lean_lib]]
name = "StrataMantle"
globs = ["StrataMantle.+"]

[[lean_lib]]
name = "StrataMantleTest"
globs = ["StrataMantleTest.+"]

[[lean_lib]]
name = "StrataPython"
extraDepTargets = ["PythonDialectIon"]

# Pylate reads the Strata Python AST, so it needs the dialect (`Python_map`,
# `Python.name`, `Command.ofAst`) from `StrataPython`, and the dialect Ion file
# that `StrataPython` embeds -- hence the same `extraDepTargets` as that lib.
[[lean_lib]]
name = "Pylate"
extraDepTargets = ["PythonDialectIon"]

# Pylate's own Lean suites. They are a separate executable rather than the
# package `testDriver`, because a package has exactly one and the host already
# uses it for `StrataPythonFrontEndTestMain`.
[[lean_lib]]
name = "PylateTests"
globs = ["Pylate.Tests.+"]

[[lean_exe]]
name = "pylateTests"
root = "Pylate.Tests.Main"
needs = ["Pylate", "StrataPython"]

[[lean_lib]]
name = "StrataPythonTest"
globs = ["StrataPythonTest.+"]

[[lean_lib]]
name = "StrataPythonTestExtra"
globs = ["StrataPythonTestExtra.+"]

[[lean_exe]]
name = "StrataPythonFrontEndTestMain"
needs = ["StrataPython", "StrataPythonTest", "StrataMantleTest", "pylateTests"]

[[lean_exe]]
name = "pylate"
root = "Scripts.pylate"
needs = ["Pylate", "StrataPython"]

[[lean_exe]]
name = "pyAnalyzeLaurel"
root = "Scripts.pyAnalyzeLaurel"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyAnalyzeV2"
root = "Scripts.pyAnalyzeV2"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyAnalyzeToGoto"
root = "Scripts.pyAnalyzeToGoto"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyTranslateLaurel"
root = "Scripts.pyTranslateLaurel"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyAnalyzeLaurelToGoto"
root = "Scripts.pyAnalyzeLaurelToGoto"
needs = ["StrataPython"]

[[lean_exe]]
name = "pySpecToLaurel"
root = "Scripts.pySpecToLaurel"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyResolveOverloads"
root = "Scripts.pyResolveOverloads"
needs = ["StrataPython"]

[[lean_exe]]
name = "pyInterpret"
root = "Scripts.pyInterpret"
needs = ["StrataPython"]

[[lean_exe]]
name = "pySpecs"
root = "Scripts.pySpecs"
needs = ["StrataPython"]

[[lean_exe]]
name = "strata"
root = "StrataMain"
needs = ["StrataPython"]

[[lean_exe]]
name = "pymantle"
root = "Scripts.pymantle"
needs = ["StrataPython"]
